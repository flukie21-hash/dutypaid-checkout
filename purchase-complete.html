<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYMENT COMPLETE - Duty Paid</title>
<style>
  :root { --bg:#0b0c0e; --panel:#121417; --text:#e8e6e1; --dim:#8f9a92; --accent:#ff7a29; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--text); font-family: "Segoe UI", system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:520px; background:var(--panel); border-top:3px solid var(--accent);
          padding:36px 32px; text-align:center; }
  .brand { letter-spacing:.3em; font-size:13px; color:var(--dim); }
  h1 { margin:14px 0 10px; font-size:34px; letter-spacing:.04em; color:var(--accent); }
  p { color:var(--dim); line-height:1.55; margin:8px 0; }
  .big { font-size:56px; line-height:1; margin-top:8px; color:var(--accent); }
  .hint { margin-top:22px; font-size:13px; color:#6b7570; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">DUTY PAID</div>
    <div class="big">&#10003;</div>
    <h1>PAYMENT COMPLETE</h1>
    <p>Thanks for your purchase.</p><p>Your Duty Credits or item will appear in the game within a few seconds. If the store was closed, they arrive next time you open it.</p>
    <p class="hint">You can close this tab and return to the game.</p>
  </div>
</body>
</html>
